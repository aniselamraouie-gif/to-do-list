<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Achiever - Premium Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        
        body { 
            font-family: 'Tajawal', sans-serif; 
            background: #050507; 
            color: #ffffff; 
            min-height: 100vh;
        }

        .glass-card { 
            background: rgba(20, 20, 25, 0.7); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,255,255,0.04); 
        }

        .task-high { 
            background: rgba(239, 68, 68, 0.03); 
            border-right: 5px solid #ef4444; 
        }

        .task-normal { 
            background: rgba(59, 130, 246, 0.03); 
            border-right: 5px solid #3b82f6; 
        }

        .completed-task {
            opacity: 0.4;
            filter: grayscale(0.5);
        }

        @keyframes taskIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-task { animation: taskIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="p-4 md:p-12 pb-24">

    <!-- حاوية وضع التركيز الكامل (Focus Mode) -->
    <div id="focus-overlay" class="hidden fixed inset-0 bg-[#050507] z-50 flex flex-col items-center justify-center p-6 text-center">
        <button onclick="exitFocusMode()" class="absolute top-6 left-6 text-gray-400 hover:text-white flex items-center gap-2 border border-white/10 px-4 py-2 rounded-xl bg-white/5">
            <i class="ri-close-line text-xl"></i> خروج من وضع التركيز
        </button>
        <div class="max-w-xl w-full glass-card p-12 rounded-3xl border border-blue-500/30 shadow-2xl shadow-blue-500/5">
            <span id="focus-prio" class="text-xs font-bold uppercase tracking-widest bg-blue-500/20 text-blue-400 px-3 py-1 rounded-full">مهمة جارية</span>
            <h2 id="focus-title" class="text-3xl font-black my-6 text-gray-100">اسم المهمة الافتراضي</h2>
            <div id="focus-timer" class="text-5xl font-mono font-bold text-amber-400 my-8 bg-black/40 py-6 rounded-2xl border border-white/5">00:00</div>
            <button id="focus-toggle-btn" class="bg-blue-600 hover:bg-blue-500 px-8 py-3 rounded-xl font-bold transition-all active:scale-95 text-white">
                تشغيل العداد
            </button>
        </div>
    </div>

    <!-- الواجهة الرئيسية -->
    <div id="main-content" class="max-w-3xl mx-auto">
        
        <!-- اسم المطور -->
        <div class="text-center mb-6">
            <span class="text-[10px] tracking-[0.5em] text-blue-500 font-bold uppercase opacity-70">
                Developed by Anis
            </span>
        </div>

        <!-- العنوان والاقتباس -->
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-black mb-4 bg-gradient-to-r from-white via-blue-400 to-gray-500 bg-clip-text text-transparent">
                معاً نحو تحقيق الأحلام
            </h1>
            <p id="quote-display" class="text-emerald-400 font-medium italic min-h-[1.5rem] text-sm md:text-base"></p>
        </header>

        <!-- لوحة الإحصائيات والأرقام المتقدمة -->
        <div class="glass-card p-6 rounded-3xl mb-6 grid grid-cols-1 md:grid-cols-2 gap-6 shadow-2xl">
            <!-- التقدم اليومي -->
            <div class="bg-black/20 p-4 rounded-2xl border border-white/5">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-2">
                        <span class="text-lg">📈</span>
                        <span class="text-sm font-bold text-gray-200">التقدم اليومي</span>
                    </div>
                    <span id="daily-count" class="text-xs text-gray-400 font-medium">0 / 0 مهام</span>
                </div>
                <div class="w-full bg-white/5 h-3 rounded-full overflow-hidden mb-2">
                    <div id="daily-bar" class="bg-gradient-to-l from-blue-500 to-cyan-400 h-full w-0 transition-all duration-500"></div>
                </div>
                <div class="text-left"><span id="daily-percent" class="text-xs text-blue-400 font-bold">0%</span></div>
            </div>

            <!-- التقدم الأسبوعي -->
            <div class="bg-black/20 p-4 rounded-2xl border border-white/5">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-2">
                        <span class="text-lg">📅</span>
                        <span class="text-sm font-bold text-gray-200">التقدم الأسبوعي</span>
                    </div>
                    <span id="weekly-count" class="text-xs text-gray-400 font-medium">0 / 0 مهام</span>
                </div>
                <div class="w-full bg-white/5 h-3 rounded-full overflow-hidden mb-2">
                    <div id="weekly-bar" class="bg-gradient-to-l from-purple-500 to-pink-500 h-full w-0 transition-all duration-500"></div>
                </div>
                <div class="text-left"><span id="weekly-percent" class="text-xs text-purple-400 font-bold">0%</span></div>
            </div>
        </div>

        <!-- خانة إضافة مهمة جديدة متطورة -->
        <div class="glass-card p-5 rounded-3xl mb-6 shadow-2xl border border-white/10">
            <div class="flex flex-col gap-4">
                <input type="text" id="taskInput" placeholder="اكتب خطوتك القادمة نحو حلمك..." 
                    class="w-full bg-black/40 border border-white/5 rounded-2xl px-6 py-4 outline-none focus:border-blue-500 transition-all text-base md:text-lg placeholder:text-gray-600">
                
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <select id="priority" class="bg-black/40 border border-white/5 rounded-2xl px-4 py-4 outline-none cursor-pointer text-sm text-gray-300 focus:border-blue-500">
                        <option value="high">🔥 مهمة كبرى</option>
                        <option value="normal" selected>✨ هدف عادي</option>
                    </select>

                    <div class="relative flex items-center">
                        <input type="number" id="taskDuration" placeholder="المدة (دقائق)" min="1"
                            class="w-full bg-black/40 border border-white/5 rounded-2xl px-4 py-4 outline-none focus:border-blue-500 transition-all text-sm text-center placeholder:text-gray-600">
                    </div>
                    
                    <button onclick="addTask()" class="bg-blue-600 hover:bg-blue-500 px-8 py-4 rounded-2xl font-bold shadow-lg shadow-blue-600/10 active:scale-95 transition-all text-white text-sm">
                        إضافة الخطوة
                    </button>
                </div>
            </div>
        </div>

        <!-- أزرار الفلترة وتصفيف المهام -->
        <div class="flex justify-center gap-2 mb-6 text-xs md:text-sm">
            <button onclick="setFilter('all')" id="filter-all" class="px-5 py-2.5 rounded-xl font-bold bg-white/10 text-white transition-all">الكل</button>
            <button onclick="setFilter('active')" id="filter-active" class="px-5 py-2.5 rounded-xl font-bold text-gray-400 hover:bg-white/5 transition-all">النشطة</button>
            <button onclick="setFilter('completed')" id="filter-completed" class="px-5 py-2.5 rounded-xl font-bold text-gray-400 hover:bg-white/5 transition-all">المكتملة</button>
        </div>

        <!-- حاوية عرض المهام الرئيسية -->
        <div id="container" class="space-y-4"></div>
    </div>

    <audio id="successSound" src="https://assets.mixkit.co/active_storage/sfx/2018/success-fanfare-trumpets-603.wav"></audio>

    <script>
        const DEVELOPER = "Gemini";
        let tasks = JSON.parse(localStorage.getItem('dream_tasks_global_v2')) || [];
        let currentFilter = 'all';
        let activeFocusId = null;
        
        const quotes = [
            "النجاح ليس محطة، بل طريق مستمر.",
            "كل صباح هو فرصة جديدة لتقترب من حلمك.",
            "العظمة تبدأ بقرار المحاولة.",
            "لا تتوقف حتى تصبح فخوراً بنفسك."
        ];

        function init() {
            console.log("System Initialized by", DEVELOPER);
            displayQuote();
            render();
            // تشغيل محرك تحديث العدادات كل ثانية
            setInterval(engineTick, 1000);
        }

        function displayQuote() {
            const q = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('quote-display').innerText = `"${q}"`;
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            ['all', 'active', 'completed'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if(f === filterType) {
                    btn.classList.add('bg-white/10', 'text-white');
                    btn.classList.remove('text-gray-400');
                } else {
                    btn.classList.remove('bg-white/10', 'text-white');
                    btn.classList.add('text-gray-400');
                }
            });
            render();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const prio = document.getElementById('priority');
            const durationInput = document.getElementById('taskDuration');

            if (!input.value.trim()) return;

            let totalSeconds = null;
            if (durationInput.value && parseInt(durationInput.value) > 0) {
                totalSeconds = parseInt(durationInput.value) * 60;
            }

            const task = {
                id: Date.now(),
                text: input.value,
                prio: prio.value,
                done: false,
                createdAt: Date.now(),
                initialSeconds: totalSeconds, // المدة الكلية المحفوظة للاستدلال
                remainingSeconds: totalSeconds, // الوقت المتبقي الفعلي بالثواني
                timerRunning: false, // العداد يبدأ متوقفاً دائماً بناءً على طلبك
                time: new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'})
            };

            tasks.unshift(task);
            input.value = '';
            durationInput.value = '';
            saveAndRender();
        }

        function toggleTask(id) {
            const index = tasks.findIndex(t => t.id === id);
            if (tasks[index].done) return;

            tasks[index].done = true;
            tasks[index].timerRunning = false; // إيقاف العداد عند الاكتمال

            document.getElementById('successSound').play().catch(e => console.log("Sound muted by browser"));

            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#3b82f6', '#10b981', '#ffffff']
            });

            if(activeFocusId === id) exitFocusMode();
            saveAndRender();
        }

        function toggleTimer(id, event) {
            if(event) event.stopPropagation(); // منع حدوث تداخل في الضغطات
            const index = tasks.findIndex(t => t.id === id);
            if(index !== -1 && !tasks[index].done && tasks[index].remainingSeconds > 0) {
                tasks[index].timerRunning = !tasks[index].timerRunning;
                saveAndRender();
                if(activeFocusId === id) updateFocusOverlayUI();
            }
        }

        function deleteTask(id, event) {
            if(event) event.stopPropagation();
            tasks = tasks.filter(t => t.id !== id);
            if(activeFocusId === id) exitFocusMode();
            saveAndRender();
        }

        function enterFocusMode(id) {
            const task = tasks.find(t => t.id === id);
            if (!task || task.done || task.remainingSeconds === null) return;
            
            activeFocusId = id;
            document.getElementById('focus-overlay').classList.remove('hidden');
            updateFocusOverlayUI();
        }

        function exitFocusMode() {
            activeFocusId = null;
            document.getElementById('focus-overlay').classList.add('hidden');
            render();
        }

        function updateFocusOverlayUI() {
            if (!activeFocusId) return;
            const task = tasks.find(t => t.id === activeFocusId);
            if(!task) return;

            document.getElementById('focus-title').innerText = task.text;
            document.getElementById('focus-prio').innerText = task.prio === 'high' ? '🔥 مهمة كبرى جارية' : '✨ هدف عادي جاري';
            
            const btn = document.getElementById('focus-toggle-btn');
            if(task.timerRunning) {
                btn.innerText = "إيقاف مؤقت ⏸️";
                btn.className = "bg-amber-600 hover:bg-amber-500 px-8 py-3 rounded-xl font-bold transition-all text-white";
            } else {
                btn.innerText = "تشغيل العداد ▶️";
                btn.className = "bg-blue-600 hover:bg-blue-500 px-8 py-3 rounded-xl font-bold transition-all text-white";
            }
            btn.onclick = (e) => toggleTimer(task.id, e);

            const timerElement = document.getElementById('focus-timer');
            if (task.remainingSeconds <= 0) {
                timerElement.innerText = "⌛ انتهى الوقت!";
                timerElement.className = "text-5xl font-mono font-bold text-red-500 my-8 bg-black/40 py-6 rounded-2xl border border-red-500/20 animate-pulse";
            } else {
                const mins = Math.floor(task.remainingSeconds / 60);
                const secs = task.remainingSeconds % 60;
                timerElement.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                timerElement.className = "text-5xl font-mono font-bold text-amber-400 my-8 bg-black/40 py-6 rounded-2xl border border-white/5";
            }
        }

        function saveAndRender() {
            localStorage.setItem('dream_tasks_global_v2', JSON.stringify(tasks));
            render();
        }

        // المحرك البرمجي الرئيسي الذي ينبض كل ثانية
        function engineTick() {
            let changed = false;
            tasks.forEach(task => {
                if(task.timerRunning && task.remainingSeconds > 0) {
                    task.remainingSeconds--;
                    changed = true;
                    if(task.remainingSeconds <= 0) {
                        task.timerRunning = false;
                    }
                }
            });

            if(changed) {
                localStorage.setItem('dream_tasks_global_v2', JSON.stringify(tasks));
                // تحديث الواجهات الحية دون إعادة بناء الهيكل كاملاً تجنباً للوميض المزعج
                tasks.forEach(task => {
                    if(task.initialSeconds !== null) {
                        const el = document.getElementById(`timer-display-${task.id}`);
                        if(el) {
                            if(task.remainingSeconds <= 0) {
                                el.innerText = "⌛ انتهى الوقت!";
                                el.className = "text-[11px] text-red-400 font-bold bg-red-500/10 px-2 py-0.5 rounded-lg";
                            } else {
                                const m = Math.floor(task.remainingSeconds / 60);
                                const s = task.remainingSeconds % 60;
                                el.innerText = `⏱️ المتبقي: ${m}د ${s}ث`;
                            }
                        }
                    }
                });
                if(activeFocusId) updateFocusOverlayUI();
            }
        }

        function updateProgressStats() {
            const now = Date.now();
            const oneDay = 24 * 60 * 60 * 1000;
            const oneWeek = 7 * oneDay;

            const dailyTasks = tasks.filter(t => (now - t.createdAt) <= oneDay);
            const weeklyTasks = tasks.filter(t => (now - t.createdAt) <= oneWeek);

            // حساب الأرقام والنسب لليوم
            const dTotal = dailyTasks.length;
            const dDone = dailyTasks.filter(t => t.done).length;
            const dPercent = dTotal === 0 ? 0 : Math.round((dDone / dTotal) * 100);
            document.getElementById('daily-count').innerText = `${dDone} / ${dTotal} مهام`;
            document.getElementById('daily-percent').innerText = `${dPercent}%`;
            document.getElementById('daily-bar').style.width = `${dPercent}%`;

            // حساب الأرقام والنسب للأسبوع
            const wTotal = weeklyTasks.length;
            const wDone = weeklyTasks.filter(t => t.done).length;
            const wPercent = wTotal === 0 ? 0 : Math.round((wDone / wTotal) * 100);
            document.getElementById('weekly-count').innerText = `${wDone} / ${wTotal} مهام`;
            document.getElementById('weekly-percent').innerText = `${wPercent}%`;
            document.getElementById('weekly-bar').style.width = `${wPercent}%`;
        }

        function render() {
            const container = document.getElementById('container');
            container.innerHTML = '';

            updateProgressStats();

            let filteredTasks = tasks;
            if (currentFilter === 'active') filteredTasks = tasks.filter(t => !t.done);
            if (currentFilter === 'completed') filteredTasks = tasks.filter(t => t.done);

            filteredTasks.forEach(task => {
                const styleClass = task.prio === 'high' ? 'task-high' : 'task-normal';
                
                // إعداد شاشات مؤقت المهام في الواجهة والتحكم بـ البدء / التوقيف
                let timerSectionHtml = '';
                if (task.initialSeconds !== null) {
                    if (task.done) {
                        timerSectionHtml = `<span class="text-[11px] text-emerald-400 font-bold bg-emerald-500/10 px-2 py-0.5 rounded-lg">✓ اكتملت</span>`;
                    } else {
                        let timerString = "⏱️ جاهز للبدء";
                        let timerColorClass = "text-amber-400 bg-amber-500/10";
                        
                        if(task.remainingSeconds <= 0) {
                            timerString = "⌛ انتهى الوقت!";
                            timerColorClass = "text-red-400 bg-red-500/10";
                        } else if (task.timerRunning) {
                            const m = Math.floor(task.remainingSeconds / 60);
                            const s = task.remainingSeconds % 60;
                            timerString = `⏱️ المتبقي: ${m}د ${s}ث`;
                        }

                        const playPauseIcon = task.timerRunning ? 'ri-pause-line text-amber-400' : 'ri-play-line text-emerald-400';
                        
                        timerSectionHtml = `
                            <div class="flex items-center gap-2 mt-1 sm:mt-0">
                                <span id="timer-display-${task.id}" class="text-[11px] font-bold px-2 py-0.5 rounded-lg ${timerColorClass}">${timerString}</span>
                                ${task.remainingSeconds > 0 ? `
                                    <button onclick="toggleTimer(${task.id}, event)" class="p-1 rounded-lg bg-white/5 hover:bg-white/10 transition-all flex items-center justify-center" title="تشغيل/إيقاف مؤقت">
                                        <i class="${playPauseIcon} text-sm"></i>
                                    </button>
                                    <button onclick="enterFocusMode(${task.id})" class="p-1 rounded-lg bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 transition-all flex items-center justify-center text-xs px-2 font-bold" title="وضع التركيز">
                                        🎯 تركيز
                                    </button>
                                ` : ''}
                            </div>
                        `;
                    }
                }
                
                container.innerHTML += `
                    <div class="glass-card ${styleClass} p-5 rounded-2xl flex items-center justify-between animate-task ${task.done ? 'completed-task' : ''}">
                        <div class="flex items-center gap-4 w-full ml-2">
                            <button onclick="toggleTask(${task.id})" class="h-8 w-8 rounded-xl border-2 ${task.done ? 'bg-emerald-500 border-emerald-500' : 'border-gray-600'} flex items-center justify-center transition-all shrink-0">
                                ${task.done ? '<i class="ri-check-line text-black font-bold text-xl"></i>' : ''}
                            </button>
                            <div class="w-full sm:flex sm:items-center sm:justify-between gap-4">
                                <div>
                                    <h3 class="text-base md:text-lg font-medium text-gray-100 ${task.done ? 'line-through text-gray-500' : ''}">${task.text}</h3>
                                    <span class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">${task.time}</span>
                                </div>
                                ${timerSectionHtml}
                            </div>
                        </div>
                        <button onclick="deleteTask(${task.id}, event)" class="text-gray-600 hover:text-red-500 transition-colors p-2 shrink-0">
                            <i class="ri-delete-bin-line text-xl"></i>
                        </button>
                    </div>
                `;
            });
        }

        init();
    </script>
</body>
</html>
